buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'com.diffplug.spotless'

group = 'com.faforever'


java {
    sourceCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

dependencies {
    annotationProcessor("org.projectlombok:lombok:$lombokVersion")
    implementation("org.projectlombok:lombok:$lombokVersion")
    testAnnotationProcessor("org.projectlombok:lombok:$lombokVersion")
    testImplementation("org.projectlombok:lombok:$lombokVersion")

    annotationProcessor("info.picocli:picocli-codegen:$picocliVersion")
    implementation("info.picocli:picocli:$picocliVersion")

    implementation("org.jitsi:ice4j:3.0-66-g1c60acc")
    implementation("com.github.faforever:JJsonRpc:37669e0fed")
    implementation("com.google.guava:guava:$guavaVersion")
    implementation("org.slf4j:slf4j-api:1.7.36")
    implementation("ch.qos.logback:logback-classic:$logbackVersion")
    implementation("ch.qos.logback:logback-core:$logbackVersion")
    implementation("org.java-websocket:Java-WebSocket:1.5.3")
    implementation('com.fasterxml.jackson.core:jackson-databind:2.13.4.2')
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4")

    if(javafxClasspath == "compileOnly") {
        compileOnly("org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}")
        compileOnly("org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}")
        compileOnly("org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}")
        compileOnly("org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}")
        compileOnly("org.openjfx:javafx-web:${javafxVersion}:${javafxPlatform}")
        compileOnly("org.openjfx:javafx-media:${javafxVersion}:${javafxPlatform}")
    } else {
        implementation("org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}")
        implementation("org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}")
        implementation("org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}")
        implementation("org.openjfx:javafx-fxml:${javafxVersion}:${javafxPlatform}")
        implementation("org.openjfx:javafx-web:${javafxVersion}:${javafxPlatform}")
        implementation("org.openjfx:javafx-media:${javafxVersion}:${javafxPlatform}")
    }
}

shadowJar {
    def plattformSuffix = javafxPlatform
    if(javafxClasspath == "compileOnly") {
        plattformSuffix = "nojfx"
    }

    getArchiveFileName().set("faf-ice-adapter-${version}-${plattformSuffix}.jar")
    manifest {
        attributes 'Main-Class': 'com.faforever.iceadapter.IceAdapter'
    }
}

// src/test only holds main()-style manual experiments, no JUnit tests.
tasks.named("test") {
    failOnNoDiscoveredTests = false
}

// Black-box integration tests: the shadow jar is launched as a subprocess and driven over JSON-RPC,
// with faf-test-harness's mock-game standing in for the game on the GPGNet side.
sourceSets {
    integrationTest
}

dependencies {
    integrationTestImplementation(platform("org.junit:junit-bom:5.10.2"))
    integrationTestImplementation("org.junit.jupiter:junit-jupiter")
    integrationTestRuntimeOnly("org.junit.platform:junit-platform-launcher")
    integrationTestImplementation("org.assertj:assertj-core:3.25.3")
    integrationTestImplementation('com.fasterxml.jackson.core:jackson-databind:2.13.4.2')
}

def mockGameJar = layout.buildDirectory.file("test-harness/mock-game-${fafTestHarnessVersion}-all.jar")

tasks.register("downloadMockGame") {
    description = "Downloads the pinned faf-test-harness mock-game jar and verifies its checksum."
    inputs.property("version", fafTestHarnessVersion)
    inputs.property("sha256", mockGameSha256)
    outputs.file(mockGameJar)
    doLast {
        def target = mockGameJar.get().asFile
        def url = "https://github.com/md-173/faf-test-harness/releases/download/${fafTestHarnessVersion}/mock-game-${fafTestHarnessVersion}-all.jar"
        target.parentFile.mkdirs()
        URI.create(url).toURL().withInputStream { input -> target.withOutputStream { it << input } }
        def actual = java.security.MessageDigest.getInstance("SHA-256").digest(target.bytes).encodeHex().toString()
        if (actual != mockGameSha256) {
            target.delete()
            throw new GradleException("Checksum mismatch for ${url}: expected ${mockGameSha256}, got ${actual}")
        }
    }
}

tasks.register("integrationTest", Test) {
    description = "Runs the adapter jar against faf-test-harness mock games."
    group = "verification"
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn(tasks.named("shadowJar"), tasks.named("downloadMockGame"))
    inputs.file(tasks.named("shadowJar").flatMap { it.archiveFile })
    inputs.file(mockGameJar)

    def logDir = layout.buildDirectory.dir("integration-test-logs")
    outputs.dir(logDir)
    doFirst {
        systemProperty("iceAdapter.jar", tasks.shadowJar.archiveFile.get().asFile.absolutePath)
        systemProperty("mockGame.jar", mockGameJar.get().asFile.absolutePath)
        systemProperty("integrationTest.logDir", logDir.get().asFile.absolutePath)
    }
    testLogging {
        events("passed", "skipped", "failed")
        exceptionFormat = "full"
    }
}

tasks.named("check") {
    dependsOn("spotlessCheck")
}

spotless {
    java {
        cleanthat()
        palantirJavaFormat()
    }
}