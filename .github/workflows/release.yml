name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Checks
        run: |
          ./gradlew \
            --stacktrace \
            -PjavafxPlatform=linux \
            -PwebrtcPlatform=linux \
            -Pno-integration \
            test

      - name: Build Windows Files
        run: |
          ./gradlew \
            -Pversion="${{ inputs.version }}" \
            -PjavafxPlatform=win \
            -PwebrtcPlatform=win \
            --stacktrace \
            :ice-adapter:shadowJar

      - name: Build Linux Files
        run: |
          ./gradlew \
            -Pversion="${{ inputs.version }}" \
            -PjavafxPlatform=linux \
            -PwebrtcPlatform=linux \
            --stacktrace \
            :ice-adapter:shadowJar

      - name: Build Mac Files
        run: |
          ./gradlew \
            -Pversion="${{ inputs.version }}" \
            -PjavafxPlatform=mac \
            -PwebrtcPlatform=mac \
            --stacktrace \
            :ice-adapter:shadowJar

      - name: Build No-JavaFX Files
        run: |
          ./gradlew \
            -Pversion="${{ inputs.version }}" \
            -PjavafxPlatform=linux \
            -PwebrtcPlatform=all \
            -PjavafxClasspath=compileOnly \
            --stacktrace \
            :ice-adapter:shadowJar

      - name: List Artifacts
        shell: bash
        run: |
          set -eux
          find ice-adapter/build/libs -maxdepth 1 -type f -printf '%f\n'

      - name: Verify Release Files
        shell: bash
        run: |
          set -eux

          files=(ice-adapter/build/libs/faf-ice-adapter-*.jar)

          if [ "${#files[@]}" -eq 0 ] || [ ! -f "${files[0]}" ]; then
            echo "No release JAR files found"
            exit 1
          fi

          for file in "${files[@]}"; do
            test -f "$file"
            file "$file"
            ls -lh "$file"
          done

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          tag: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: true
          prerelease: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ice-adapter/build/libs/faf-ice-adapter-*.jar
          artifactErrorsFailBuild: true
          allowUpdates: true